[build-system]
requires = ["setuptools>=77.0.3", "wheel", "Cython>=0.29.0", "numpy>=1.19.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chess_engine"
version = "0.2.3.5.dev1"
description = "A UCI chess engine with Cython extensions"
license = "GPL-3.0-only AND CC0-1.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/licenses/*.txt"]
requires-python = ">=3.12,<3.13"
authors = [
    {name = "ReallyNot Sure"}
]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.19.0",
    "cython>=0.29.0",
    "chess>=1.9.0",
    "pandas>=1.3.0",
    "matplotlib>=3.3.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "mypy>=0.910",
    "black>=21.7b0",
    "isort>=5.9.0"
]
test = [
    "pytest>=6.0",
    "coverage>=6.0",
    "pandas>=1.3.0",
    "matplotlib>=3.3.0"
]
