name: Correctness

on:
  pull_request:
    branches: [feature/optimizations]
  push:
    branches: [feature/optimizations]

permissions:
  contents: read

concurrency:
  group: correctness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - name: Install and build native extensions
        run: |
          python -m pip install -r ci/requirements.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python setup.py build_ext --inplace
          python -m pip freeze
      - name: Active correctness suite
        run: |
          site_packages="$(python -S -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          env -i PATH="$PATH" HOME="$HOME" \
            PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 \
            PYTHONNOUSERSITE=1 PYTHONOPTIMIZE=0 PYTHONSAFEPATH=1 \
            PYTHONPATH="$PWD/src:$PWD:$site_packages" \
            STOCKCONDA_TEST_SOURCE="$PWD/src" \
            python -S -s -B -P -m pytest -q tests
      - name: Established strict type checks
        run: |
          site_packages="$(python -S -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          env -i PATH="$PATH" HOME="$HOME" \
            PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 \
            PYTHONNOUSERSITE=1 PYTHONOPTIMIZE=0 PYTHONSAFEPATH=1 \
            PYTHONPATH="$PWD/src:$PWD:$site_packages" MYPYPATH="$PWD/src:$PWD" \
            python -S -s -B -P -m mypy --strict \
              scripts/ap04b_runtime_policy.py scripts/ap04b_gate2.py \
              scripts/ap04b_ordering_benchmark.py scripts/ap04b_gate3_audit.py \
              scripts/ap04b_match_pipeline.py tests/test_ap04b_runtime_policy.py \
              tests/test_ap04b_gate2.py tests/test_ap04b_ordering_benchmark.py \
              tests/test_ap04b_match_pipeline.py
